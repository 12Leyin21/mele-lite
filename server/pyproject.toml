[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "newapp-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30",
  "pgvector>=0.3.6",
  "numpy>=2.0",
  "jieba>=0.42.1",
  "anthropic>=1.8",
  "openai>=3.19",
  "google-genai>=2.25",
  "fastapi>=0.141",
  "uvicorn>=0.54",
  "cryptography>=43",
  "pypdf>=6.0",
  "pillow>=11.0",
  "python-multipart>=0.0.20",
  "httpx[http2]>=0.28",
  "librosa>=0.11",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.3"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.28"]

[tool.hatch.build.targets.wheel]
packages = ["memory", "llm", "brain", "web", "api", "patrol", "push", "music", "food"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
